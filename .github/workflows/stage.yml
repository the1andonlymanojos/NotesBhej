name: Stage frontend

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: docker.io/manojthedonut/notesbhej
  STAGE_API_URL: https://notesbhej-stage.mshiv.net
  STAGE_NAMESPACE: notesbhej-stage
  STAGE_DEPLOYMENT: notesbhej-stage

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  build-deploy:
    name: Build and deploy stage
    needs: test
    if: github.ref == 'refs/heads/stage'
    runs-on: [self-hosted, linux, notesbhej-stage, frontend]
    environment: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build stage image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          docker build --network=host \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$STAGE_API_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$STAGE_API_URL" \
            --build-arg NEXT_PUBLIC_APP_ENV="stage" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
            --build-arg API_SERVER_BASE_URL="http://127.0.0.1:30008" \
            -t "$REGISTRY_IMAGE:${GITHUB_SHA}" \
            -t "$REGISTRY_IMAGE:stage" .

      - name: Push stage image
        run: |
          docker push "$REGISTRY_IMAGE:${GITHUB_SHA}"
          docker push "$REGISTRY_IMAGE:stage"

      - name: Configure stage namespace and secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          kubectl apply -f k8s-stage/namespace.yaml
          kubectl -n "$STAGE_NAMESPACE" create secret generic notesbhej-stage-secrets \
            --from-literal=NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --from-literal=R2_BUCKET_NAME="$R2_BUCKET_NAME" \
            --from-literal=R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
            --from-literal=R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            --from-literal=R2_SECRET_KEY="$R2_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy stage manifests
        run: |
          kubectl apply -k k8s-stage
          kubectl -n "$STAGE_NAMESPACE" set image deployment/$STAGE_DEPLOYMENT \
            app="$REGISTRY_IMAGE:${GITHUB_SHA}"
          kubectl -n "$STAGE_NAMESPACE" rollout status deployment/$STAGE_DEPLOYMENT --timeout=180s

      - name: Smoke-test backend and frontend
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            "$STAGE_API_URL/api/v1/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            http://127.0.0.1:31000/
