apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesbhej
  namespace: notesbhej
  labels:
    app.kubernetes.io/name: notesbhej
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesbhej
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesbhej
    spec:
      containers:
        - name: app
          image: docker.io/manojthedonut/notesbhej:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: notesbhej-config
            - secretRef:
                name: notesbhej-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
