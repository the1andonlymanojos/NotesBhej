apiVersion: v1
kind: ConfigMap
metadata:
  name: notesbhej-config
  namespace: notesbhej
data:
  NODE_ENV: production
  NEXT_PUBLIC_APP_ENV: production
  NEXT_PUBLIC_API_BASE_URL: https://notesbhej.mshiv.net
  NEXT_PUBLIC_SITE_URL: https://notesbhej.mshiv.net
  # Same-namespace backend Service DNS. This avoids routing pod-to-pod traffic
  # through the node's NodePort.
  API_SERVER_BASE_URL: http://notesbhej-api:8080
