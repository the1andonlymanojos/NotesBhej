# Copy this file outside the repository, replace every value, and apply it.
# Never commit the populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: notesbhej-secrets
  namespace: notesbhej
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: REPLACE_ME
  NEXT_PUBLIC_SUPABASE_ANON_KEY: REPLACE_ME
  SUPABASE_SERVICE_ROLE_KEY: REPLACE_ME
  R2_BUCKET_NAME: REPLACE_ME
  R2_ACCOUNT_ID: REPLACE_ME
  R2_ACCESS_KEY_ID: REPLACE_ME
  R2_SECRET_KEY: REPLACE_ME
